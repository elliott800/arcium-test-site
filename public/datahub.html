<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17241f">
  <title>Datahub — Arcium</title>
  <link rel="stylesheet" href="/datahub.css">
</head>
<body>
  <header class="datahub-topbar">
    <a class="brand" href="/" aria-label="Return to Arcium workspace">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M20 3.5 36.5 13v14L20 36.5 3.5 27V13L20 3.5Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="m12 25 8-14 8 14m-12-5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>ARCIUM</span>
    </a>
    <div class="topbar-context">
      <span class="context-mark">DH</span>
      <span>DATAHUB</span>
    </div>
    <a class="workspace-link" href="/">Back to workspace</a>
  </header>

  <main class="datahub-shell">
    <aside class="datahub-sidebar" aria-label="Datahub navigation">
      <div class="sidebar-heading">
        <p class="eyebrow">DATA ENVIRONMENT</p>
        <h1>Datahub</h1>
      </div>
      <nav id="datahub-navigation" class="datahub-navigation" aria-label="Datahub sections">
        <button type="button" class="nav-item is-active" data-section="home" aria-current="page"><span>⌂</span>Home</button>
        <button type="button" class="nav-item" data-section="recorder"><span>◉</span>Recorder</button>
        <button type="button" class="nav-item" data-section="sources"><span>⇄</span>Sources</button>
        <button type="button" class="nav-item" data-section="warehouse"><span>▤</span>Warehouse</button>
      </nav>
      <div class="sidebar-status"><span class="status-dot"></span> Local demo</div>
    </aside>

    <section class="datahub-content" aria-live="polite">
      <div id="datahub-view"></div>
    </section>
  </main>
  <script src="/datahub.js"></script>
</body>
</html>
